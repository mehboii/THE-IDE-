name: Build Linux AppImage

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  appimage:
    name: Linux AppImage (x64)
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - name: Install dependencies and rebuild native modules for Electron
        run: npm ci

      - name: Create portable AppImage
        run: npm run dist:linux

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-x64
          path: dist/*.AppImage
          if-no-files-found: error

      - name: Publish tagged build to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.AppImage
